name: Fetch WagForex Scorecard

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ...your install and fetch steps unchanged...

      - name: Keep repo active
        run: |
          if [ -z "$(git log -1 --since='30 days ago' --format=%H)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
